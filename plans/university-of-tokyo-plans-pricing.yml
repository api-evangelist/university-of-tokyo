description: >-
  University of Tokyo is a non-commercial higher-education institution; its APIs are not sold
  as a commercial product. Its institution-operated public interfaces — two OAI-PMH endpoints, IIIF Presentation and
  Image, the Archives Portal item representations, and the repository records JSON API — are
  free and require no credential of any kind: no API key exists to issue and no registration
  is offered. Reuse of the underlying material is governed per-record and per-collection by
  the library's reuse conditions, not by a plan. There is no course, registrar or
  student-information API at any price. Administrative services (UTOL, the HPC portal, STEP10)
  are gated behind GakuNin SAML federation membership rather than payment.
notes: >-
  Re-verified 2026-08-19 under the university pipeline. No published per-seat or per-call commercial pricing. "Free / Open" reflects open
  public endpoints; "Affiliation / Credentialed" reflects access gated by institutional
  identity rather than payment.
