x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Every surface in this profile is operated by the University of Tokyo on a host under its own
    registrable domain u-tokyo.ac.jp, and every one was verified with a live probe on 2026-08-19.
    No vendor tenancy exists to record: u-tokyo.figshare.com and utokyo.figshare.com return HTTP
    202 with a zero-byte body, utokyo.pure.elsevier.com 301s to a hostname that does not resolve,
    utokyo.instructure.com returns 404, and no Dataverse, Symplectic or Ex Libris tenant could be
    substantiated. This institution is one of the minority in the cohort that runs its own
    repository software rather than buying a hosted one, so the Figshare misattribution that
    defines this cohort simply does not apply here.

    Two limits on the coverage, both about the deployment rather than about the institution.
    First, the documented search API at /portal/search returned HTTP 403 to every external
    automated client tested — with a browser User-Agent, without one, and from two independent
    network paths — so its parameters are transcribed from the university's documentation and
    could not be confirmed by response. Second, repository.dl.itc.u-tokyo.ac.jp returns HTTP 406
    to browser-shaped User-Agents and 200 to plain clients, an inverted block that would make the
    host read as dead to any crawler applying the usual retry heuristic; it was probed correctly
    and is fully live.

    The June 2026 profile of this institution recorded two surfaces and missed the rest because it
    read the English help page, which says only "Only available in Japanese". The Japanese page at
    /portal/help/api carries the full parameter tables. Searching the local language is what moved
    this profile from two surfaces to five.
