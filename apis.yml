aid: university-of-tokyo
name: University of Tokyo
x-type: university
x-category: Public Research University
description: >-
  The University of Tokyo (東京大学, UTokyo) is Japan's oldest and largest national research
  university, founded in 1877, and ranks 28th in the QS World University Rankings. Like almost
  every institution in this cohort it operates no developer program: there is no API key, no
  OAuth server, no course or student-information API, no status page, and no OpenAPI, AsyncAPI
  or GraphQL schema on any host it owns. What it does operate — entirely on its own domain, with
  no vendor tenancy anywhere in the picture — is library and digital-humanities infrastructure,
  and that infrastructure is real and standards-conformant rather than nominal. Two OAI-PMH 2.0
  endpoints answer live: the UTokyo Repository (self-hosted WEKO3, 69,549 records, seven metadata
  formats including JPCOAR 2.0 and DDI Codebook) and the Academic Assets Archives Portal (1,957
  sets, thirteen years of persistent-deletion metadata). The Archives Portal also serves IIIF
  Presentation 2.1 manifests, a IIIF Image API 2.0 level2 service on iiif.dl.itc.u-tokyo.ac.jp,
  and DC-NDL item metadata as JSON-LD, CSV and refer/BibIX. The repository additionally exposes an
  undocumented but fully live JSON records interface. Beyond the library, the university operates
  three Shibboleth SAML 2.0 entities registered in GakuNin, Japan's academic access federation —
  the identity layer is the largest piece of machine-readable engineering the institution actually
  owns, and it is the piece that never appears in an API catalog. Two honest caveats define this
  profile: the only API documentation the university publishes exists in Japanese only, so an
  English-language survey finds nothing here at all; and the documented search API returns HTTP
  403 to every external automated client, so it is blocked rather than absent.
