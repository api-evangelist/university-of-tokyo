apis:
  - aid: university-of-tokyo:archives-portal
    name: UTokyo Academic Assets Archives Portal API
    x-operator: institution
    x-operator-evidence: >-
      da.dl.itc.u-tokyo.ac.jp is under the university's own registrable domain. Manifests carry
      attribution "東京大学総合図書館 General Library, The University of Tokyo, JAPAN" and a license
      pointing at lib.u-tokyo.ac.jp. No vendor host, title or contact appears anywhere.
    description: >-
      The one surface where the University of Tokyo publishes actual API documentation — at
      /portal/help/api, in Japanese only. It names a search API described as OpenSearch and a
      harvesting API described as OAI-PMH, and alongside them the portal serves item
      representations as JSON-LD (application/ld+json, DC-NDL vocabulary), CSV and refer/BibIX
      through a _format parameter. The search endpoint itself returns HTTP 403 to external
      automated clients even though its OpenSearch description document is served at 200; the
      item representations and manifests are open.
