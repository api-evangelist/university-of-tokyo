  - aid: university-of-tokyo:iiif
    name: UTokyo IIIF Presentation and Image APIs
    x-operator: institution
    x-operator-evidence: >-
      iiif.dl.itc.u-tokyo.ac.jp and da.dl.itc.u-tokyo.ac.jp are both u-tokyo.ac.jp hosts. The
      Image API server serves the university's own logo at /images/ut-logo.jpg.
    description: >-
      IIIF Presentation API 2.1 manifests served from the Archives Portal and a IIIF Image API 2.0
      level2 service on iiif.dl.itc.u-tokyo.ac.jp. The Image server declares formats tif/jpg/gif/png,
      qualities bitonal/default/gray/color, 512x512 tiling with scale factors to 128, arbitrary
      rotation, CORS and canonical link headers. Manifests carry attribution, license,
      viewingDirection and cross-links to the item page, the item JSON-LD and the parent
      collection. This is the most standards-conformant surface the institution runs.
