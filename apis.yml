  - aid: university-of-tokyo:repository-records
    name: UTokyo Repository Records API
    x-operator: institution
    x-operator-evidence: >-
      repository.dl.itc.u-tokyo.ac.jp is a u-tokyo.ac.jp host running WEKO3, the open-source
      repository platform NII publishes, installed and operated by the University of Tokyo Library
      System. It is self-hosted software, not a vendor tenancy — no vendor host, contact or brand
      appears in any response.
    description: >-
      A live, unauthenticated JSON records interface at /api/records/ exposing 69,549 repository
      records with full-text query, size/page paging and self/next links. Records carry
      JPCOAR-shaped metadata and a registered DOI under the university's own prefix 10.15083 via
      JaLC. The university documents this nowhere and its robots.txt disallows /api/, so it is
      recorded as an internal surface that happens to be reachable rather than as a product — but
      it is genuinely the institution's, genuinely live, and it is the largest machine-readable
      corpus the university serves.
    humanURL: https://repository.dl.itc.u-tokyo.ac.jp/
    baseURL: https://repository.dl.itc.u-tokyo.ac.jp/api
