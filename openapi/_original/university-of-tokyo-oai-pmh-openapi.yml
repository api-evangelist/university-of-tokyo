openapi: 3.1.0
info:
  title: UTokyo OAI-PMH Metadata Harvesting
  version: '2.0'
  summary: >-
    The two OAI-PMH 2.0 harvesting endpoints the University of Tokyo operates on its own hosts —
    the institutional repository and the Academic Assets Archives Portal.
  description: |
    OAI-PMH is the one machine-readable interface the University of Tokyo documents publicly and
    operates itself, and it is served twice:

    * **UTokyo Repository** — `https://repository.dl.itc.u-tokyo.ac.jp/oai`. Identify returns
      repositoryName "UTokyo Repository", adminEmail digilib@lib.u-tokyo.ac.jp, earliest
      datestamp 2017-03-28, deletedRecord `transient`. Seven metadata formats: `jpcoar_2.0`,
      `jpcoar`, `jpcoar_1.0`, `jpcoar_v1`, `oai_dc`, `ddi` (DDI-Codebook 2.5) and `lom`.
    * **UTokyo Academic Assets Archives Portal** — `https://da.dl.itc.u-tokyo.ac.jp/portal/oai`.
      Identify returns repositoryName "UTokyo Academic Archives Portal", adminEmail
      jitsumu_arch@lib.u-tokyo.ac.jp, earliest datestamp 2013-01-01, deletedRecord `persistent`,
      1,957 sets. Five metadata formats: `oai_dc`, `dcndl_simple`, `dcndl_js`, `junii2`, `jpcoar`.
      This one is documented, in Japanese only, at
      https://da.dl.itc.u-tokyo.ac.jp/portal/help/api — the English page at
      /portal/en/help/api says only "Only available in Japanese" and links across.

    This document describes the protocol as these two deployments actually answer it. OAI-PMH is
    a query-string verb protocol, not a REST API, so the OpenAPI shape here is a description for
    tooling, not a claim that the university publishes an OpenAPI. Responses are XML.

    Access note: `repository.dl.itc.u-tokyo.ac.jp` returns HTTP 406 to requests carrying a
    desktop-browser User-Agent and HTTP 200 to a plain client. The block is inverted from the
    usual bot challenge. Harvest it with a plain HTTP client and a real contact string, not with
    a spoofed browser UA.
  contact:
    name: University of Tokyo Library System — Digital Library Section
    email: digilib@lib.u-tokyo.ac.jp
    url: https://www.lib.u-tokyo.ac.jp/en/
externalDocs:
  description: API documentation for the Archives Portal (Japanese only)
  url: https://da.dl.itc.u-tokyo.ac.jp/portal/help/api
x-operator: institution
x-operator-evidence: >-
  Both hosts are under u-tokyo.ac.jp. Both Identify responses name the University of Tokyo as
  the repository and give a lib.u-tokyo.ac.jp admin contact. No vendor host is involved.
x-provenance:
  generated: '2026-08-19'
  method: probed
  source:
    - https://repository.dl.itc.u-tokyo.ac.jp/oai?verb=Identify
    - https://repository.dl.itc.u-tokyo.ac.jp/oai?verb=ListMetadataFormats
    - https://repository.dl.itc.u-tokyo.ac.jp/oai?verb=ListSets
    - https://da.dl.itc.u-tokyo.ac.jp/portal/oai?verb=Identify
    - https://da.dl.itc.u-tokyo.ac.jp/portal/oai?verb=ListMetadataFormats
    - https://da.dl.itc.u-tokyo.ac.jp/portal/oai?verb=ListSets
