- date: '2026-08-19'
  rating: 3
  summary: 'Re-profiled under the API Evangelist university pipeline, which settles operator attribution
    before saving any artifact. Outcome for this institution: every surface is x-operator: institution
    — no vendor tenancy could be substantiated at all (u-tokyo.figshare.com and utokyo.figshare.com return
    HTTP 202 with a zero-byte body, utokyo.pure.elsevier.com 301s to a hostname that does not resolve,
    utokyo.instructure.com returns 404). UTokyo self-hosts WEKO3 on its own domain rather than buying
    a hosted repository, so the Figshare misattribution that defines this cohort does not apply here.


    The June 2026 profile recorded two surfaces. This pass found five, and the reason the earlier pass
    missed three of them is instructive: the English API help page at /portal/en/help/api returns 200
    with one sentence — "Only available in Japanese" — while the Japanese page at /portal/help/api carries
    the complete verb, parameter, format and resumptionToken paging tables. New this pass: a second OAI-PMH
    endpoint on the Archives Portal (1,957 sets, earliest datestamp 2013-01-01, persistent deletion records);
    a live undocumented JSON records API at /api/records/ carrying 69,549 records; item representations
    in JSON-LD, CSV and refer/BibIX; IIIF Presentation 2.1 manifests and a IIIF Image 2.0 level2 service
    verified against a real manifest and info.json; and three Shibboleth SAML 2.0 entities registered
    in GakuNin, which is the institution''s largest genuinely-owned machine-readable artifact and had
    never been catalogued.


    Two edge behaviours were recorded because they change how the surfaces read. repository.dl.itc.u-tokyo.ac.jp
    returns HTTP 406 to a desktop-browser User-Agent and 200 to a plain client — inverted from the usual
    bot challenge, so the standard retry heuristic makes a fully live host look dead. And the documented
    search API at /portal/search returns HTTP 403 to every external automated client tested, from two
    independent network paths; it is blocked, not absent, and its parameters are transcribed from the
    university''s own documentation rather than confirmed by response.


    The institution still publishes no OpenAPI, no developer program, no API key, no OAuth server, no
    status page and no course or student-information API. Every OpenAPI in this repository was derived
    by API Evangelist from live probes and says so in x-provenance. Nothing was fabricated.'
