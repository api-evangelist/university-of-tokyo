reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      The University of Tokyo has no unified, branded developer portal or
      authenticated REST API program. Its confirmed public, machine-readable
      surface is library/digital-humanities oriented: the utda Digital Archive
      Portal exposes IIIF image/presentation APIs plus downloadable IIIF
      Collections and JSON-LD/RDF/CSV/TEI datasets (API docs Japanese-only),
      and the UTokyo Repository (WEKO) serves a live OAI-PMH 2.0 endpoint that
      was verified to return a valid Identify response (repositoryName
      "UTokyo Repository"). The official GitHub at github.com/UTokyo exists but
      has no public repositories; the active code presence is github.com/utda.
      No course/SIS/timetable APIs were found public. All listed URLs were
      probed live; nothing here is fabricated.
